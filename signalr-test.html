<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignalR Notification Test</title>
    <!-- Include the SignalR JavaScript client from a CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        #log { margin-top: 20px; padding: 10px; background: #333; color: #0f0; height: 300px; overflow-y: scroll; border-radius: 4px; font-family: monospace; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="container">
    <h2>Test BoslaPlatform Notifications</h2>
    
    <div class="form-group">
        <label for="hubUrl">Hub URL (Change port if needed):</label>
        <input type="text" id="hubUrl" value="https://localhost:44397/hubs/notifications"> <!-- Update port if yours is different -->
    </div>
    
    <div class="form-group">
        <label for="jwtToken">Your JWT Access Token:</label>
        <input type="text" id="jwtToken" placeholder="Paste your access token here (without 'Bearer ')">
    </div>

    <button id="connectBtn">Connect</button>
    <button id="disconnectBtn" disabled>Disconnect</button>

    <h3>Logs & Notifications</h3>
    <div id="log">Waiting to connect...</div>
</div>

<script>
    let connection = null;

    function logMessage(msg) {
        const logDiv = document.getElementById("log");
        const time = new Date().toLocaleTimeString();
        logDiv.innerHTML += `<div>[${time}] ${msg}</div>`;
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    document.getElementById("connectBtn").addEventListener("click", async () => {
        const url = document.getElementById("hubUrl").value;
        const token = document.getElementById("jwtToken").value;

        if (!token) {
            alert("Please enter a JWT token first.");
            return;
        }

        connection = new signalR.HubConnectionBuilder()
            .withUrl(url, {
                accessTokenFactory: () => token 
            })
            .configureLogging(signalR.LogLevel.Information)
            .build();

        // Listen for the "ReceiveNotification" event
        connection.on("ReceiveNotification", (notification) => {
            logMessage("🔔 NEW NOTIFICATION RECEIVED:");
            logMessage(JSON.stringify(notification, null, 2));
        });

        try {
            logMessage("Connecting...");
            await connection.start();
            logMessage("✅ Connected successfully to SignalR hub!");
            
            document.getElementById("connectBtn").disabled = true;
            document.getElementById("disconnectBtn").disabled = false;
        } catch (err) {
            logMessage("❌ Error connecting: " + err.toString());
            console.error(err);
        }
    });

    document.getElementById("disconnectBtn").addEventListener("click", async () => {
        if (connection) {
            await connection.stop();
            logMessage("🛑 Disconnected.");
            
            document.getElementById("connectBtn").disabled = false;
            document.getElementById("disconnectBtn").disabled = true;
        }
    });
</script>

</body>
</html>
